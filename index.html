<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Notiva — Modern Toast Notification & Alert Modal Library for JavaScript</title>
    <meta name="description" content="Notiva is a lightweight, zero-dependency toast notification and confirm/alert modal library. Beautiful alternative to SweetAlert2 for React, Vue, Svelte, Laravel, PHP & Vanilla JS. 9 positions, dark mode, fully customizable." />
    <meta name="keywords" content="toast notification library, javascript alert modal, sweetalert alternative, sweetalert2 alternative, confirm modal javascript, react toast, vue toast, laravel notification, php alert, vanilla js toast, popup notification, dialog box javascript, alert library, notification library, toast js, notiva" />

    <link rel="canonical" href="https://notiva.habibabdillah.my.id/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://notiva.habibabdillah.my.id/" />
    <meta property="og:title" content="Notiva — Modern Toast & Alert Modal Library" />
    <meta property="og:description" content="Lightweight, zero-dependency toast notification and confirm modal library. Beautiful SweetAlert2 alternative for React, Vue, Laravel & Vanilla JS." />
    <meta property="og:image" content="https://notiva.habibabdillah.my.id/og-image.png" />
    <meta property="og:site_name" content="Notiva" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://notiva.habibabdillah.my.id/" />

    <meta name="twitter:image" content="https://notiva.habibabdillah.my.id/og-image.png" />
    <meta name="twitter:creator" content="@muhabibabd" />

    <!-- JSON-LD Structured Data (helps Google understand the library) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Notiva",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "url": "https://notiva.habibabdillah.my.id",
      "downloadUrl": "https://www.npmjs.com/package/notiva",
      "description": "Modern Toast Notification and Confirm Modal library for HTML, PHP, Laravel, and modern JS frameworks. Zero dependencies, 9 positions, dark/light/system themes.",
      "softwareVersion": "1.0.0",
      "license": "https://opensource.org/licenses/MIT",
      "author": {
        "@type": "Person",
        "name": "Habib Abdillah",
        "url": "https://habibabdillah.my.id"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "keywords": "toast, notification, modal, alert, confirm, javascript, react, vue, laravel, sweetalert alternative"
    }
    </script>

    <!-- Detect and apply System theme on load -->
    <script>
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>



    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">



    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      code, pre {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
